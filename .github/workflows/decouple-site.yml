name: Continuous GoDaddy Asset Decoupler

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger this anytime with one click

jobs:
  decouple_assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives GitHub server permission to write images back to your repo

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Inline Execution Script
        run: |
          cat << 'EOF' > run_decouple.js
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          const targetDir = './';
          const imageFolder = './images';
          const extensions = ['.html', '.js', '.css'];

          if (!fs.existsSync(imageFolder)) {
              fs.mkdirSync(imageFolder, { recursive: true });
          }

          const godaddyPattern = /(?:https?:)?\/\/[:a-zA-Z0-9._-]*wsimg\.com\/isteam\/ip\/[a-f0-9-]+\/[a-zA-Z0-9%._-]+\.(?:jpg|jpeg|png|gif|ico|JPG|JPEG|PNG|GIF|ICO)/gi;

          function downloadAsset(url, destPath) {
              return new Promise((resolve, reject) => {
                  const file = fs.createWriteStream(destPath);
                  const requestUrl = url.startsWith('http') ? url : `https:${url}`;
                  
                  https.get(requestUrl, (response) => {
                      if (response.statusCode !== 200) {
                          reject(new Error(`Status ${response.statusCode}`));
                          return;
                      }
                      response.pipe(file);
                      file.on('finish', () => file.close(resolve));
                  }).on('error', (err) => {
                      fs.unlink(destPath, () => reject(err));
                  });
              });
          }

          async function crawlAndClean(dir) {
              const items = fs.readdirSync(dir);
              for (const item of items) {
                  const fullPath = path.join(dir, item);
                  if (fs.statSync(fullPath).isDirectory()) {
                      if (['.git', '.github', 'node_modules', 'images'].includes(item)) continue;
                      await crawlAndClean(fullPath);
                  } else if (extensions.includes(path.extname(item).toLowerCase())) {
                      let content = fs.readFileSync(fullPath, 'utf8');
                      let modified = false;

                      // 1. Identify external image assets matching the rules
                      const matches = content.match(godaddyPattern);
                      if (matches) {
                          for (const match of [...new Set(matches)]) {
                              const cleanUrl = match.split('?')[0].split('/:')[0];
                              const rawFilename = path.basename(cleanUrl);
                              const decodedFilename = decodeURIComponent(rawFilename);
                              const localDest = path.join(imageFolder, decodedFilename);

                              if (!fs.existsSync(localDest)) {
                                  console.log(`📥 Fetching asset to GitHub CDN: ${decodedFilename}`);
                                  try {
                                      await downloadAsset(cleanUrl, localDest);
                                  } catch (err) {
                                      console.log(`⚠️ Skip download: ${decodedFilename}`);
                                  }
                              }
                          }
                      }

                      // 2. Repair common string corruptions from older tools (.pngs= -> .png?)
                      if (/\.(png|jpg|jpeg|gif)s=/i.test(content)) {
                          content = content.replace(/\.(png|jpg|jpeg|gif)s=/gi, '.\$1?');
                          modified = true;
                      }

                      // 3. Purge freemium display ad wrappers natively
                      if (/<div[^>]*id="freemium-ad-[0-9]+"[^>]*><\/div>/gi.test(content)) {
                          content = content.replace(/<div[^>]*id="freemium-ad-[0-9]+"[^>]*><\/div>/gi, '');
                          modified = true;
                      }

                      // 4. Translate external domain references into clean local repository relative paths
                      const replacePattern = /(?:https?:)?\/\/[:a-zA-Z0-9._-]*wsimg\.com\/isteam\/ip\/[a-f0-9-]+\/[a-zA-Z0-9%._-]+\.(?:jpg|jpeg|png|gif|ico|JPG|JPEG|PNG|GIF|ICO)(?:\/[^\s"\'\>]+)?/gi;
                      if (replacePattern.test(content)) {
                          content = content.replace(replacePattern, (urlMatch) => {
                              const cleanUrl = urlMatch.split('?')[0].split('/:')[0];
                              const rawFile = path.basename(cleanUrl);
                              return `./images/${decodeURIComponent(rawFile)}`;
                          });
                          modified = true;
                      }

                      if (modified) {
                          fs.writeFileSync(fullPath, content, 'utf8');
                      }
                  }
              }
          }

          (async () => {
              await crawlAndClean(targetDir);
              console.log("🏁 Asset conversion suite completed processing.");
          })();
          EOF

      - name: Execute Node.js Processing Engine
        run: node run_decouple.js

      - name: Clean Up Temporary Execution Runtime
        run: rm -f run_decouple.js

      - name: Commit and Push Normalized Workspace Back to Repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Automated Asset Sourcing: Decoupled platform links & scraped media binaries to GitHub CDN"
          file_pattern: "*.html *.js *.css images/*"
